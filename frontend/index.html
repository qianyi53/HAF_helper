<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>核安全设备许可证查询 · HAF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 4v9c0 8-5.4 13.6-12 15C9.4 28.6 4 23 4 15V6z' fill='%231a56b8'/%3E%3Cpath d='M16 6l8 2.7V15c0 5.6-3.6 9.5-8 10.7C11.6 24.5 8 20.6 8 15V8.7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0b2f6b; --navy2:#123f8c; --blue:#1a56b8; --blue2:#2f6fd6;
  --sky:#e9f2fc; --sky2:#d8e8fa; --line:#d7e4f4; --bg:#f4f8fd;
  --ink:#152740; --muted:#5e7396; --ok:#1a56b8; --bad:#c24545; --warn:#b07914;
  --card:#ffffff; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--blue)}
button{font-family:inherit}

/* header */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 78%,var(--blue2) 100%);color:#fff;padding:22px 16px 52px}
.hero-in{max-width:1080px;margin:0 auto}
.hero h1{font-size:21px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.hero h1 svg{flex:none}
.hero p{margin-top:6px;font-size:12.5px;opacity:.82}

.wrap{max-width:1080px;margin:-32px auto 0;padding:0 12px 40px}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;max-width:220px;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:10px 8px;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(26,86,184,.28)}

/* search card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px rgba(18,63,140,.06)}
.search{padding:14px}
.search-row{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;outline:none;background:#fbfdff;color:var(--ink)}
.search input:focus{border-color:var(--blue2);background:#fff}
.search button{border:none;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;padding:0 22px;cursor:pointer}
.search button:active{background:var(--navy2)}
.hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--sky2);background:var(--sky);color:var(--blue);border-radius:999px;
  padding:4px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--sky2)}

/* result meta */
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--blue);font-weight:700}

/* table */
.tablewrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:0 4px 18px rgba(18,63,140,.06)}
table{width:100%;border-collapse:collapse;min-width:660px}
thead th{position:sticky;top:0;z-index:2;background:var(--sky);color:var(--navy);font-size:12.5px;
  text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1.5px solid var(--line);user-select:none}
th.sortable{cursor:pointer}
th.sortable:hover{background:var(--sky2)}
th .arrow{font-size:10px;margin-left:3px;color:var(--blue2)}
tbody td{padding:10px 12px;border-bottom:1px solid #ecf3fb;font-size:13.5px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f6faff}
tbody tr:last-child td{border-bottom:none}
.dev-main{font-weight:600}
.sub{font-size:11.5px;color:var(--muted);margin-top:3px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-name{font-weight:600}
.nowrap{white-space:nowrap}
.hide-sm{ }
@media (max-width:680px){ .hide-sm{display:none} }
.lnk{display:inline-block;margin:1px 6px 1px 0;font-size:12.5px;color:var(--blue);text-decoration:none;
  background:var(--sky);border:1px solid var(--sky2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.lnk:hover{background:var(--sky2)}
.pg{font-size:11px;color:var(--muted);margin-left:2px}

/* tags */
.tag{display:inline-block;border-radius:999px;padding:2.5px 10px;font-size:11.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.tag.ok{background:#e3eefc;color:var(--blue)}
.tag.mut{background:#eef1f5;color:#7a8aa0}
.tag.bad{background:#fbe9e9;color:var(--bad)}
.tag.warn{background:#fdf3dd;color:var(--warn)}
.tag.line{background:#fff;border:1px solid var(--sky2);color:var(--blue);font-weight:500}

/* pager */
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--blue);cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* states */
.state{padding:44px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.state .big{font-size:30px;margin-bottom:8px}
.err{color:var(--bad)}
.skel{padding:14px}
.skel .bar{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef3fa,#f7fafd,#eef3fa);background-size:200% 100%;animation:sk 1.1s infinite;margin:10px 12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* drawer */
.mask{position:fixed;inset:0;background:rgba(9,26,54,.45);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:#fff;z-index:60;
  transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(9,26,54,.18)}
.drawer.show{transform:none}
.d-head{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px 18px 14px}
.d-head .tag{background:rgba(255,255,255,.18)!important;color:#fff!important;border-color:transparent!important}
.d-close{position:absolute;top:12px;right:12px;border:none;background:rgba(255,255,255,.16);color:#fff;
  width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.d-head h2{font-size:16.5px;line-height:1.45;padding-right:36px}
.d-sub{margin-top:6px;font-size:12.5px;opacity:.85;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.d-body{flex:1;overflow-y:auto;padding:14px 16px 30px;-webkit-overflow-scrolling:touch}
.d-sec{margin-bottom:18px}
.d-sec h3{font-size:13px;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.d-sec h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--blue)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:13px}
.kv .k{color:var(--muted)}
.d-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.d-links .lnk{background:#fff}
.chg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.chg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chg-date{font-weight:700;color:var(--navy)}
.chg-sum{margin-top:6px;color:var(--ink);line-height:1.55}
.chg-links{margin-top:6px}
.chg-toggle{margin-top:8px;border:none;background:none;color:var(--blue);font-size:12.5px;cursor:pointer;padding:0}
.diff{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;line-height:1.7}
.diff .row{display:flex;gap:6px;align-items:baseline}
.diff .lab{flex:none;width:34px;text-align:center;border-radius:5px;font-size:11px;font-weight:700;padding:1px 0}
.lab.add{background:#e4f5ea;color:#1c7c3c}
.lab.del{background:#fbe9e9;color:var(--bad)}
.lab.mod{background:#fdf3dd;color:var(--warn)}
.diff .txt{color:var(--ink);min-width:0}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td{padding:7px 8px;border-bottom:1px solid #ecf3fb;vertical-align:top}
.mini tr:last-child td{border-bottom:none}
.mut{color:var(--muted)}
.footnote{margin-top:22px;text-align:center;font-size:11.5px;color:#93a7c4;line-height:1.8}
@media (max-width:680px){
  .hero{padding:18px 14px 48px}
  .hero h1{font-size:18px}
  .tab{max-width:none}
  .search button{padding:0 16px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <h1>
      <svg width="26" height="26" viewBox="0 0 32 32"><path d="M16 2l12 4v9c0 8-5.4 13.6-12 15C9.4 28.6 4 23 4 15V6z" fill="rgba(255,255,255,.22)"/><path d="M16 6l8 2.7V15c0 5.6-3.6 9.5-8 10.7C11.6 24.5 8 20.6 8 15V8.7z" fill="#fff"/></svg>
      核安全设备许可证查询
    </h1>
    <p>民用核安全设备许可数据 · 来源：生态环境部（国家核安全局）公开文函 · <span id="freshness">数据更新中…</span></p>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-device" role="tab">🔧 按设备查询</button>
    <button class="tab" id="tab-unit" role="tab">🏢 按单位查询</button>
  </div>

  <div class="card search">
    <div class="search-row">
      <input id="kw" type="search" placeholder="搜索设备类别 / 品种，如：阀门、热交换器、泵…" autocomplete="off">
      <button id="btn-search">搜索</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="meta">
    <span id="count">输入关键词开始查询</span>
    <span id="scope-note"></span>
  </div>

  <div class="tablewrap" id="tablewrap">
    <div class="state"><div class="big">🔎</div>按设备或单位搜索许可证、活动范围与变更记录</div>
  </div>

  <div class="pager" id="pager" style="display:none">
    <button id="prev">上一页</button>
    <span id="pageinfo"></span>
    <button id="next">下一页</button>
  </div>

  <div class="footnote">
    口径说明：列表仅展示各许可证<b>当前版本（链尾）</b>数据；变更与历史版本请在详情中查看。<br>
    数据截至 <span id="freshness2">…</span> · 本页为只读查询，原文以生态环境部官网为准
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head">
    <button class="d-close" id="d-close" aria-label="关闭">✕</button>
    <div id="d-head-in"></div>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function () {
  'use strict'
  var ENDPOINT = 'https://haf-license.app.workbuddy.host'
  var PUBKEY = 'wbpk_YGFKLa2QDfDKLyAjkfLitn_4FT5p3Zh7rAutBNwf3HXtriTvWPEzZ8K'
  var PAGE_SIZE = 20
  var FETCH_CAP = { device: 800, unit: 600 }

  if (!window.WorkBuddyCloud) {
    document.getElementById('tablewrap').innerHTML =
      '<div class="state err"><div class="big">⚠</div>SDK 加载失败，请检查网络后刷新重试</div>'
    return
  }
  var cloud = WorkBuddyCloud.createWorkBuddyCloud({ endpoint: ENDPOINT, publishableKey: PUBKEY })

  /* ---------- state ---------- */
  var state = {
    tab: 'device', kw: '', rows: [], sort: { key: null, dir: 'asc' },
    page: 1, loading: false, capped: false
  }
  var sortKeys = { device: { key: '__dev', dir: 'desc' }, unit: { key: '单位名称', dir: 'asc' } }

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id) }
  function esc(s) {
    if (s === null || s === undefined) return ''
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }
  function tr(s, n) { s = s == null ? '' : String(s); return s.length > n ? s.slice(0, n) + '…' : s }
  function dash(s) { return (s === null || s === undefined || s === '') ? '<span class="mut">—</span>' : esc(s) }
  function sanitize(kw) { return kw.replace(/[,*"()\\'\n\r]/g, ' ').replace(/\s+/g, ' ').trim() }

  function statusTag(s) {
    if (s === '有效') return '<span class="tag ok">有效</span>'
    if (s === '已注销') return '<span class="tag mut">已注销</span>'
    if (s === '无效') return '<span class="tag bad">无效</span>'
    if (s === '待核实') return '<span class="tag warn">待核实</span>'
    if (!s) return '<span class="tag mut">未知</span>'
    return '<span class="tag mut">' + esc(s) + '</span>'
  }
  function certTag(s) {
    if (!s) return '<span class="tag mut">未标注</span>'
    if (s.indexOf('其他') === 0) return '<span class="tag mut">未识别证照</span>'
    return '<span class="tag line">' + esc(s.replace('民用核安全设备', '')) + '</span>'
  }
  function linksHtml(docUrl, pdfUrl, page) {
    var out = ''
    if (docUrl) out += '<a class="lnk" href="' + esc(docUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">🌐 文函</a>'
    if (pdfUrl) out += '<a class="lnk" href="' + esc(pdfUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 PDF' +
      (page ? '<span class="pg">p' + esc(page) + '</span>' : '') + '</a>'
    return out || '<span class="mut">—</span>'
  }
  function sortRows(rows, key, dir) {
    var mul = dir === 'asc' ? 1 : -1
    return rows.slice().sort(function (a, b) {
      var va = a[key], vb = b[key]
      var ae = (va === null || va === undefined || va === ''), be = (vb === null || vb === undefined || vb === '')
      if (ae && be) return 0
      if (ae) return 1
      if (be) return -1
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul
      return String(va).localeCompare(String(vb), 'zh-Hans-CN') * mul
    })
  }

  /* ---------- table columns ---------- */
  function devVal(r) { return (r['设备类别'] || '') + ' ' + (r['设备品种'] || '') }
  var COLS = {
    device: [
      { key: '__dev', label: '设备', sortVal: devVal, cell: devCell },
      { key: '持证单位', label: '持证单位', cell: function (r) {
          var sub = r['持证单位所在国'] ? '<div class="sub">' + esc(r['持证单位所在国']) + '</div>' : ''
          return '<div class="unit-name">' + esc(tr(r['持证单位'], 42)) + '</div>' + sub } },
      { key: '核安全级别', label: '核安全级别', cell: function (r) { return dash(r['核安全级别']) } },
      { key: '证字号', label: '证字号', cell: function (r) { return '<span class="nowrap">' + dash(r['证字号']) + '</span>' } },
      { key: '许可证状态', label: '状态', cell: function (r) { return statusTag(r['许可证状态']) } },
      { key: '数据生效日期', label: '生效日期', cls: 'hide-sm', cell: function (r) { return '<span class="nowrap">' + dash(r['数据生效日期']) + '</span>' } },
      { key: '__links', label: '原文', sortable: false, cell: function (r) { return linksHtml(r['官网链接'], r['附件链接'], r['附件页码']) } }
    ],
    unit: [
      { key: '单位名称', label: '单位名称', cell: function (r) {
          var sub = r['单位所在国'] ? '<div class="sub">' + esc(r['单位所在国']) + '</div>' : ''
          return '<div class="unit-name">' + esc(tr(r['单位名称'], 42)) + '</div>' + sub } },
      { key: '证件类型', label: '证件类型', cell: function (r) { return certTag(r['证件类型']) } },
      { key: '证字号', label: '证字号', cell: function (r) { return '<span class="nowrap">' + dash(r['证字号']) + '</span>' } },
      { key: '状态', label: '状态', cell: function (r) { return statusTag(r['状态']) } },
      { key: '有效期止', label: '有效期至', cls: 'hide-sm', cell: function (r) { return '<span class="nowrap">' + dash(r['有效期止']) + '</span>' } },
      { key: '更新日期', label: '更新日期', sortable: false, cls: 'hide-sm', cell: function (r) { return '<span class="nowrap">' + dash(r['更新日期']) + '</span>' } },
      { key: '__links', label: '原文', sortable: false, cell: function (r) { return linksHtml(r['官网链接'], r['附件链接'], r['附件页码']) } }
    ]
  }
  function devCell(r) {
    var sp = r['设备品种'], sc = r['设备类别'], st = r['设备种类']
    var main = sp || sc
    if (!main) return '<span class="mut">未标注设备</span>'
    var subParts = []
    if (st) subParts.push(st)
    if (sp && sc) subParts.push(sc)
    if (r['能力特征参数']) subParts.push(tr(r['能力特征参数'], 56))
    return '<div class="dev-main">' + esc(tr(main, 24)) + '</div>' +
      (subParts.length ? '<div class="sub">' + esc(subParts.join(' · ')) + '</div>' : '')
  }

  /* ---------- search ---------- */
  function doSearch() {
    var kw = sanitize($('kw').value)
    if (!kw) {
      state.rows = []
      $('hint').innerHTML = state.tab === 'device'
        ? '请输入关键词，将匹配设备<b>种类 / 类别 / 品种 / 持证单位</b>'
        : '请输入单位名称关键词，将模糊匹配持证单位'
      renderEmpty('请输入关键词')
      return
    }
    state.kw = kw
    state.loading = true
    state.page = 1
    state.sort = { key: sortKeys[state.tab].key, dir: sortKeys[state.tab].dir }
    renderSkeleton()
    updateHash()
    var q
    if (state.tab === 'device') {
      q = cloud.database.from('view_device_index').select('*')
        .or('设备种类.ilike.*' + kw + '*,设备类别.ilike.*' + kw + '*,设备品种.ilike.*' + kw + '*,持证单位.ilike.*' + kw + '*')
        .limit(FETCH_CAP.device)
    } else {
      q = cloud.database.from('licenses').select('*')
        .ilike('单位名称', '%' + kw + '%')
        .limit(FETCH_CAP.unit)
    }
    q.then(function (res) {
      state.loading = false
      if (res.error || res.success === false) {
        renderError(res.error || res)
        return
      }
      state.rows = res.data || []
      state.capped = state.rows.length >= FETCH_CAP[state.tab]
      applySort()
      $('hint').textContent = ''
      $('scope-note').textContent = state.tab === 'device'
        ? '口径：各证当前版本的活动范围条目；点击行查看许可证与变更'
        : '口径：一证一行（链尾快照）；点击行查看设备条目与变更'
    }).catch(function (e) { state.loading = false; renderError(e) })
  }

  function applySort() {
    if (state.sort.key) state.rows = sortRows(state.rows, COLS[state.tab].find(function (c) { return c.key === state.sort.key }).sortVal || state.sort.key, state.sort.dir)
    renderTable()
  }

  /* ---------- render ---------- */
  function renderSkeleton() {
    var bars = ''
    for (var i = 0; i < 6; i++) bars += '<div class="bar" style="width:' + (88 - i * 9) + '%"></div>'
    $('tablewrap').innerHTML = '<div class="skel">' + bars + '</div>'
    $('count').textContent = '查询中…'
    $('pager').style.display = 'none'
  }
  function renderError(e) {
    var msg = (e && (e.message || e.msg)) ? (e.message || e.msg) : '未知错误'
    $('tablewrap').innerHTML = '<div class="state err"><div class="big">⚠</div>查询失败：' + esc(tr(msg, 120)) +
      '<br><br><button class="chip" onclick="window.__rerun()">重试</button></div>'
    $('count').textContent = '查询失败'
    $('pager').style.display = 'none'
  }
  window.__rerun = doSearch
  function renderEmpty(title) {
    $('tablewrap').innerHTML = '<div class="state"><div class="big">🗂</div>' + esc(title) +
      '<br><span class="mut">换个关键词试试，例如：阀门、热交换器、泵、苏州</span></div>'
    $('count').textContent = '共 0 条'
    $('pager').style.display = 'none'
  }

  function renderTable() {
    if (!state.rows.length) { renderEmpty('未找到匹配的记录'); return }
    var cols = COLS[state.tab]
    var total = state.rows.length
    var pages = Math.ceil(total / PAGE_SIZE)
    if (state.page > pages) state.page = pages
    var start = (state.page - 1) * PAGE_SIZE
    var rows = state.rows.slice(start, start + PAGE_SIZE)

    var head = '<thead><tr>'
    cols.forEach(function (c) {
      if (!c.sortable && c.sortable !== undefined) {
        head += '<th class="' + (c.cls || '') + '">' + c.label + '</th>'
      } else {
        var arr = state.sort.key === c.key ? (state.sort.dir === 'asc' ? '<span class="arrow">▲</span>' : '<span class="arrow">▼</span>') : ''
        head += '<th class="sortable ' + (c.cls || '') + '" data-key="' + c.key + '">' + c.label + arr + '</th>'
      }
    })
    head += '</tr></thead>'

    var body = '<tbody>'
    rows.forEach(function (r) {
      body += '<tr data-lic="' + esc(r.license_id || '') + '">'
      cols.forEach(function (c) { body += '<td class="' + (c.cls || '') + '">' + c.cell(r) + '</td>' })
      body += '</tr>'
    })
    body += '</tbody>'
    $('tablewrap').innerHTML = '<table>' + head + body + '</table>'

    var countTxt = '共 <b>' + total + '</b> 条'
    if (state.capped) countTxt += '（结果较多，仅返回前 ' + FETCH_CAP[state.tab] + ' 条，请细化关键词）'
    $('count').innerHTML = countTxt

    $('pager').style.display = pages > 1 ? 'flex' : 'none'
    $('pageinfo').textContent = '第 ' + state.page + ' / ' + pages + ' 页'
    $('prev').disabled = state.page <= 1
    $('next').disabled = state.page >= pages

    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-key')
        if (state.sort.key === k) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc'
        else state.sort = { key: k, dir: 'asc' }
        state.page = 1
        applySort()
      }
    })
    Array.prototype.forEach.call(document.querySelectorAll('tbody tr'), function (tr) {
      tr.onclick = function () { openDetail(tr.getAttribute('data-lic')) }
    })
  }

  /* ---------- detail drawer ---------- */
  function openDetail(licenseId) {
    if (!licenseId) return
    $('mask').classList.add('show')
    $('drawer').classList.add('show')
    $('drawer').setAttribute('aria-hidden', 'false')
    $('d-head-in').innerHTML = '<h2>加载中…</h2>'
    $('d-body').innerHTML = '<div class="skel"><div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div><div class="bar" style="width:70%"></div></div>'

    var pLic = cloud.database.from('licenses').select('*').eq('license_id', licenseId).maybeSingle()
    var pChg = cloud.database.from('changes').select('*').eq('license_id', licenseId).order('变更日期', { ascending: false })
    var pItem = cloud.database.from('view_device_index').select('*').eq('license_id', licenseId)
    Promise.all([pLic, pChg, pItem]).then(function (rs) {
      var lic = rs[0].data, chgs = rs[0].error ? [] : (rs[1].data || []), items = rs[2].data || []
      if (rs[0].error || !lic) {
        $('d-body').innerHTML = '<div class="state err">许可证详情加载失败</div>'
        $('d-head-in').innerHTML = '<h2>' + esc(licenseId) + '</h2>'
        return
      }
      renderDetail(lic, rs[1].error ? [] : chgs, items)
    }).catch(function () {
      $('d-body').innerHTML = '<div class="state err">详情加载失败，请关闭后重试</div>'
    })
  }
  function closeDrawer() {
    $('mask').classList.remove('show')
    $('drawer').classList.remove('show')
    $('drawer').setAttribute('aria-hidden', 'true')
  }

  function renderDetail(lic, chgs, items) {
    var acts = []
    try { acts = JSON.parse(lic['活动种类'] || '[]') } catch (e) {}
    var actTags = (acts && acts.length) ? acts.map(function (a) { return '<span class="tag line">' + esc(a) + '</span>' }).join(' ') : '<span class="mut">未标注</span>'
    var period = (lic['有效期起'] || lic['有效期止'])
      ? esc(lic['有效期起'] || '？') + ' ~ ' + esc(lic['有效期止'] || '？')
      : (lic['有效期原文'] ? esc(lic['有效期原文']) : '<span class="mut">—</span>')
    var flagTag = lic['数据标志'] ? ' <span class="tag warn">' + esc(lic['数据标志']) + '</span>' : ''

    $('d-head-in').innerHTML =
      '<h2>' + esc(lic['单位名称'] || '未知单位') + statusTag(lic['状态']).replace('class="tag', 'class="tag tag-inv ') + '</h2>' +
      '<div class="d-sub">' + certTag(lic['证件类型']) + '<span>' + esc(lic['证字号'] || '无证字号') + '</span></div>'

    var html = ''
    html += '<div class="d-sec"><h3>基本信息</h3><div class="kv">' +
      '<span class="k">有效期</span><span>' + period + '</span>' +
      '<span class="k">发证日期</span><span>' + dash(lic['发证日期']) + '</span>' +
      '<span class="k">活动种类</span><span>' + actTags + '</span>' +
      (lic['单位所在国'] ? '<span class="k">所在国</span><span>' + esc(lic['单位所在国']) + '</span>' : '') +
      '<span class="k">版本数</span><span>' + dash(lic['版本数']) + '</span>' +
      '<span class="k">状态依据</span><span>' + dash(lic['状态依据']) + '</span>' +
      (lic['数据标志'] ? '<span class="k">数据提示</span><span>' + flagTag + '</span>' : '') +
      '</div><div class="d-links">' + linksHtml(lic['官网链接'], lic['附件链接'], lic['附件页码']) + '</div></div>'

    html += '<div class="d-sec"><h3>变更记录（' + chgs.length + '）</h3>'
    if (!chgs.length) html += '<div class="mut" style="font-size:12.5px">该许可证暂无变更记录</div>'
    chgs.forEach(function (c) {
      var d = null
      try { d = JSON.parse(c['变更明细'] || '{}') } catch (e) {}
      var nAdd = d ? ((d['新增'] || []).length) : 0
      var nDel = d ? ((d['删除'] || []).length) : 0
      var nMod = d ? ((d['修改'] || []).length) : 0
      html += '<div class="chg">' +
        '<div class="chg-top"><span class="chg-date">' + esc(c['变更日期'] || '日期未知') + '</span>' +
        '<span class="tag line">' + esc(c['变更类型'] || '变更') + '</span>' +
        (nAdd ? '<span class="tag ok">+' + nAdd + '</span>' : '') +
        (nDel ? '<span class="tag bad">−' + nDel + '</span>' : '') +
        (nMod ? '<span class="tag warn">~' + nMod + '</span>' : '') + '</div>' +
        '<div class="chg-sum">' + esc(c['变更摘要'] || '') + '</div>' +
        '<div class="chg-links">' +
        (c['官网链接'] ? '<a class="lnk" href="' + esc(c['官网链接']) + '" target="_blank" rel="noopener">🌐 变更文函</a>' : '') +
        (c['附件页码'] ? '<span class="pg">📎 附件 p' + esc(c['附件页码']) + '</span>' : '') + '</div>' +
        (d ? '<button class="chg-toggle" data-cid="' + esc(c.change_id) + '">展开变更明细 ▾</button><div class="diff" id="diff-' + esc(c.change_id) + '" style="display:none">' + diffHtml(d) + '</div>' : '') +
        '</div>'
    })
    html += '</div>'

    html += '<div class="d-sec"><h3>活动范围（当前版本 ' + items.length + ' 条）</h3>'
    if (items.length) {
      html += '<table class="mini"><tbody>'
      items.forEach(function (it) {
        var name = it['设备品种'] || it['设备类别'] || '未标注'
        var sub = [it['设备种类'], (it['设备品种'] && it['设备类别']) ? it['设备类别'] : null, it['能力特征参数']].filter(Boolean).join(' · ')
        html += '<tr><td><div class="dev-main" style="font-size:13px">' + esc(tr(name, 20)) + '</div>' +
          (sub ? '<div class="sub" style="max-width:300px">' + esc(tr(sub, 64)) + '</div>' : '') + '</td>' +
          '<td class="nowrap">' + dash(it['核安全级别']) + '</td>' +
          '<td class="nowrap">' + linksHtml(null, it['附件链接'], it['附件页码']) + '</td></tr>'
      })
      html += '</tbody></table>'
    } else {
      html += '<div class="mut" style="font-size:12.5px">当前版本未解析到范围条目</div>'
    }
    html += '</div>'
    $('d-body').innerHTML = html

    Array.prototype.forEach.call(document.querySelectorAll('.chg-toggle'), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute('data-cid')
        var box = $('diff-' + id)
        var open = box.style.display !== 'none'
        box.style.display = open ? 'none' : 'block'
        btn.textContent = open ? '展开变更明细 ▾' : '收起 ▴'
      }
    })
  }

  function strVal(v) {
    if (v === null || v === undefined) return ''
    if (typeof v === 'object') { try { return JSON.stringify(v) } catch (e) { return String(v) } }
    return String(v)
  }
  function scopeLine(it) {
    var parts = [it['设备品种'] || it['设备类别'] || '未标注']
    if (it['设备种类']) parts.push('(' + it['设备种类'] + ')')
    if (it['核安全级别']) parts.push(it['核安全级别'])
    var p = it['能力特征参数可读'] || ''
    return esc(tr(parts.join(' ') + (p ? ' — ' + p : ''), 90))
  }
  function diffHtml(d) {
    var html = ''
    ;(d['新增'] || []).forEach(function (it) {
      html += '<div class="row"><span class="lab add">新增</span><span class="txt">' + scopeLine(it) + '</span></div>'
    })
    ;(d['删除'] || []).forEach(function (it) {
      html += '<div class="row"><span class="lab del">删除</span><span class="txt">' + scopeLine(it) + '</span></div>'
    })
    ;(d['修改'] || []).forEach(function (m) {
      var key = (m['行键'] || []).slice(0, 3).join(' / ')
      var fields = (m['字段变更'] || []).map(function (f) {
        return esc(f['字段'] || '') + '：' + esc(tr(strVal(f['变更前']), 40)) + ' → ' + esc(tr(strVal(f['变更后']), 40))
      }).join('<br>')
      html += '<div class="row"><span class="lab mod">修改</span><span class="txt">' + esc(tr(key, 50)) +
        (fields ? '<br><span class="mut" style="font-size:11.5px">' + fields + '</span>' : '') + '</span></div>'
    })
    return html || '<span class="mut">无明细</span>'
  }

  /* ---------- chips + freshness ---------- */
  function loadChips() {
    cloud.database.from('view_device_index').select('设备类别').limit(1000).then(function (res) {
      if (res.error || !res.data) return
      var freq = {}
      res.data.forEach(function (r) {
        var v = r['设备类别']
        if (v) freq[v] = (freq[v] || 0) + 1
      })
      var top = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a] }).slice(0, 12)
      $('chips').innerHTML = top.map(function (v) {
        return '<button class="chip" data-v="' + esc(v) + '">' + esc(v) + '</button>'
      }).join('')
      Array.prototype.forEach.call($('chips').children, function (btn) {
        btn.onclick = function () { $('kw').value = btn.getAttribute('data-v'); doSearch() }
      })
    }).catch(function () {})
  }
  function loadFreshness() {
    cloud.database.from('documents').select('爬取时间').order('爬取时间', { ascending: false }).limit(1).then(function (res) {
      var t = res.data && res.data[0] && res.data[0]['爬取时间']
      if (!t) return
      var d = t.slice(0, 10)
      $('freshness').textContent = '数据更新至 ' + d
      $('freshness2').textContent = d
    }).catch(function () {})
  }

  /* ---------- tabs / hash ---------- */
  function setTab(tab) {
    state.tab = tab
    $('tab-device').classList.toggle('active', tab === 'device')
    $('tab-unit').classList.toggle('active', tab === 'unit')
    $('kw').placeholder = tab === 'device'
      ? '搜索设备类别 / 品种，如：阀门、热交换器、泵…'
      : '搜索单位名称关键词，如：核电、阀门、苏州…'
  }
  $('tab-device').onclick = function () { setTab('device'); $('kw').value = state.kw; doSearch() }
  $('tab-unit').onclick = function () { setTab('unit'); $('kw').value = state.kw; doSearch() }
  $('btn-search').onclick = doSearch
  $('kw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch() })
  $('prev').onclick = function () { if (state.page > 1) { state.page--; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }) } }
  $('next').onclick = function () { state.page++; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }) }
  $('d-close').onclick = closeDrawer
  $('mask').onclick = closeDrawer
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer() })

  function updateHash() {
    var h = state.tab + '=' + encodeURIComponent(state.kw)
    if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h)
  }
  function restoreFromHash() {
    var h = decodeURIComponent(location.hash.slice(1) || '')
    var m = h.match(/^(device|unit)=(.+)$/)
    if (m) {
      setTab(m[1])
      $('kw').value = m[2]
      return true
    }
    return false
  }

  /* ---------- init ---------- */
  var hasInitial = restoreFromHash()
  $('hint').innerHTML = '匹配范围：设备<b>种类 / 类别 / 品种 / 持证单位</b>；点击任意列头可排序，点击行查看详情'
  loadChips()
  loadFreshness()
  if (hasInitial && $('kw').value.trim()) doSearch()
})()
</script>
</body>
</html>
